[project]
name = "astra-cortex"
version = "0.1.0"
description = "ASTRA cortex — the brain: orchestration, memory, policy, human-in-the-loop."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "openai>=1.40",
    "tenacity>=8.2",
    "python-multipart>=0.0.9",   # FastAPI form parsing (admin UI)
    "bcrypt>=4.1",               # admin password hashing
    "itsdangerous>=2.1",         # signed session cookies
    "cryptography>=42.0",        # Fernet encryption for plugin secrets
]

[project.optional-dependencies]
memory = ["mem0ai>=0.1.0"]
edupage = ["edupage-api>=0.10"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
